<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ÁNCORA</title>
    <meta name="description" content="Espacio privado para organizar contexto, documentos, diario y conversaciones por usuario." />
    <!-- Google Fonts (Outfit & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      // Auto-redirección transparente de 127.0.0.1 a localhost para compatibilidad nativa con Firebase OAuth
      if (typeof window !== 'undefined' && window.location.hostname === '127.0.0.1') {
        window.location.hostname = 'localhost';
      }
    </script>
    <script>
      function isExtensionOrThirdPartyError(err) {
        if (!err) return false;
        var str = (typeof err === 'string') ? err : (err.stack || err.message || '');
        if (typeof str !== 'string') str = String(str);
        return str.includes('chrome-extension://') || 
               str.includes('moz-extension://') || 
               str.includes('safari-web-extension://') ||
               str.includes('MetaMask') ||
               str.includes('metamask') ||
               str.includes('inpage.js');
      }

      window.addEventListener('error', function(event) {
        if (event.filename && (event.filename.includes('chrome-extension://') || event.filename.includes('moz-extension://') || event.filename.includes('safari-web-extension://'))) {
          return;
        }
        if (isExtensionOrThirdPartyError(event.error) || isExtensionOrThirdPartyError(event.message)) {
          return;
        }
        showErrorOverlay('Error de Ejecución', event.error ? event.error.stack : event.message);
      });

      window.addEventListener('unhandledrejection', function(event) {
        if (isExtensionOrThirdPartyError(event.reason)) {
          return;
        }
        showErrorOverlay('Promesa Rechazada', event.reason ? (event.reason.stack || event.reason) : 'Desconocido');
      });

      function showErrorOverlay(title, stack) {
        var overlay = document.getElementById('error-overlay-global');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'error-overlay-global';
          overlay.style.position = 'fixed';
          overlay.style.top = '10px';
          overlay.style.left = '10px';
          overlay.style.right = '10px';
          overlay.style.bottom = '10px';
          overlay.style.background = 'rgba(30, 0, 0, 0.95)';
          overlay.style.color = '#ff9999';
          overlay.style.padding = '20px';
          overlay.style.fontFamily = 'monospace';
          overlay.style.fontSize = '12px';
          overlay.style.zIndex = '999999';
          overlay.style.overflow = 'auto';
          overlay.style.border = '3px solid #ff3333';
          overlay.style.borderRadius = '8px';
          overlay.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
          document.body.appendChild(overlay);
        }
        overlay.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">' +
          '<h3 style="color: #ff3333; margin: 0;">⚠️ ' + title + '</h3>' +
          '<button onclick="this.parentElement.parentElement.remove()" style="background:#ff3333; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Cerrar</button>' +
          '</div>' +
          '<pre style="white-space: pre-wrap; word-break: break-all; margin:0;">' + stack + '</pre>';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
