<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Comparativa de Mockups y Previews</title>
  <style>
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
    }
    .card h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
    }
    img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Comparativa de Imágenes y Mockups de Áncora</h1>
  <div class="grid">
    <div class="card">
      <h2>ChatGPT Mockup (1) - Landing o UI</h2>
      <p>Ruta: /chatgpt_1.png</p>
      <img src="/chatgpt_1.png" alt="ChatGPT 1">
    </div>
    <div class="card">
      <h2>ChatGPT Mockup (2) - Landing o UI</h2>
      <p>Ruta: /chatgpt_2.png</p>
      <img src="/chatgpt_2.png" alt="ChatGPT 2">
    </div>
    <div class="card">
      <h2>preview_landing.png (Actual Landing Preview)</h2>
      <img src="/preview_landing.png" alt="Preview Landing">
    </div>
    <div class="card">
      <h2>preview_dashboard.png (Actual Dashboard Preview)</h2>
      <img src="/preview_dashboard.png" alt="Preview Dashboard">
    </div>
    <div class="card">
      <h2>preview_medico.png (Actual Médico Preview)</h2>
      <img src="/preview_medico.png" alt="Preview Médico">
    </div>
  </div>
</body>
</html>
